<style>
  *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#cfd6e6;font-family:system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
  body{position:fixed;inset:0}                       /* fixed body: no scroll, no rubber-band, no pull-to-refresh */
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;display:block;background:#07080c;
    touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
  /* hidden probe so JS can read the iPhone safe-area insets (notch / home indicator) */
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<div id="safe"></div>
