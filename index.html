<script>
// Project Vacuum - prototype. Plain canvas, no build step. Open index.html.
(() => {
'use strict';
const VERSION = '0.19.1'; // keep in sync with CHANGELOG.md
// Shared online leaderboard (Cloudflare Worker, see leaderboard/README.md). '' = offline: local best only, no network calls.
// Set to the Worker URL, e.g. 'https://project-vacuum-leaderboard.<subdomain>.workers.dev' (no trailing slash), to show High Scores on title + game over.
const LEADERBOARD_URL = 'https://project-vacuum-leaderboard.silvertibby.workers.dev';
const W = 900, H = 700, CX = W / 2, CY = H / 2;   // CX,CY = centre of the arena AND the filter (the arena itself is a rounded RECTANGLE sized to the screen, see setArena)
let AW = 760, AH = 540, AX0 = CX - 380, AX1 = CX + 380, AY0 = CY - 270, AY1 = CY + 270; // arena rect in world units (updated by computeLayout)
const CORNER = 40;                                // rounded-corner radius of the canister
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- tuning ----------
const T = {
  playerSpeed: 215, playerR: 7,
  dashSpeed: 540, dashTime: 0.16, dashCd: 0.9,
  // Pulse EVENTS (v0.15: more frequent, same weak pull): first at ~20s, then gaps of 20s growing +2s per pulse toward a 40s cap (start-to-start).
  firstPulse: 20, warn: 3.5,
  interval: n => Math.min(40, 18 + 2 * n),
  // Pulse STRENGTH (core size, pull, length, roach speed bonus) still ramps up, but at half the old rate PER PULSE, since pulses come ~2x as often: the strength at a given time stays about what it was.
  lvl: n => 0.5 * n,
  pullDur: n => Math.min(6, 3.5 + 0.3 * T.lvl(n)),    // pulse length (3.6s -> 6s)
  // DANGER ZONE around the filter. The CORE kills anything that touches it; the zone is the visible hazard area.
  coreR: n => Math.min(40, 24 + 2 * T.lvl(n)),               // lethal core radius (grows with pulses)
  coreSwell: 12,                                      // extra core radius at peak of a pulse
  zoneBase: 34, zoneSwell: 28,                        // zone radius = core + zoneBase (+ zoneSwell at peak of a pulse)

// ---------- rectangular arena geometry ----------
// inside the rounded rectangle with margin m (m = entity radius + a little)
