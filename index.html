<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Vacuum (prototype)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#07080c">
<style>
  *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#cfd6e6;font-family:system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
  body{position:fixed;inset:0}                       /* fixed body: no scroll, no rubber-band, no pull-to-refresh */
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;display:block;background:#07080c;
    touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
  /* hidden probe so JS can read the iPhone safe-area insets (notch / home indicator) */
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="c" width="900" height="700" tabindex="0"></canvas>
<script>// Project Vacuum - prototype. Plain canvas, no build step. Open index.html.
(() => {
'use strict';
const W = 900, H = 700, CX = W / 2, CY = H / 2, R = 310;
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- tuning ----------
const T = {
  playerSpeed: 215, playerR: 7,
  dashSpeed: 540, dashTime: 0.16, dashCd: 0.9,
  // Rare pulse EVENTS: first at ~28s, then gaps of 32s growing +6s per pulse toward a 70s cap.
  firstPulse: 28, warn: 3.5,
  interval: n => Math.min(70, 26 + 6 * n),
  pullDur: n => Math.min(6, 3.5 + 0.3 * n),           // pulse length (3.8s -> 6s)
  // DANGER ZONE around the filter. The CORE kills anything that touches it; the zone is the visible hazard area.
  coreR: n => Math.min(40, 24 + 2 * n),               // lethal core radius (grows with pulses)
  coreSwell: 12,                                      // extra core radius at peak of a pulse
  zoneBase: 34, zoneSwell: 28,                        // zone radius = core + zoneBase (+ zoneSwell at peak of a pulse)
  // Pulls (px/s toward filter, scaled by pulse envelope):
  playerPull: n => Math.min(170, 100 + 10 * n),       // < player speed 215, but x1.5 near the core => dash out
  bugPull: n => Math.min(45, 18 + 3 * n),             // gentle nudge, ~15% of the old pull on bugs
  clumpPull: n => Math.min(90, 50 + 5 * n),           // debris drifts in and gets eaten, so it recycles
  bugAvoid: 130,                                      // non-Roach bugs steer away from the zone (px/s at the edge of the core)
  mothPickup: 34,                                     // px: player within this of an unbonded Moth recruits it
  protect: 4,                                         // seconds of spawn protection from the filter (no pull, can't be eaten)
  // Continuous escalation between pulses (by ELAPSED TIME t): one bug every ~N s, one debris clump every ~M s
  trickle: t => Math.max(1.8, 8 - t / 30),
  debrisTrickle: t => Math.max(4, 9 - t / 25),
  maxBugs: 45, maxClumps: 16,
  // Per-type aggro: idle/wander until the player is within `aggro` px; de-aggro beyond `leash` px. (Roach: always chases.)
  wasp:   { aggro: 300, leash: 400, keepMin: 150, keepMax: 235, windup: 0.65, speed: 235 },
  spider: { aggro: 230, leash: 320, speed: 46, biteRange: 85 },
  beetle: { aggro: 150, leash: 240 },
  // Webs (laid by Spiders) never expire: they wait until something non-Spider crosses them. Not lethal.
  //  player: 50% slow on a layer-1 web (up to 65% at max layers; dash 80% -> 70%); each pass removes one layer.
  //  bugs (incl. Roaches): caught = stuck for ~webStuck s (longer per layer) at webStuckSlow speed, then one layer is removed. Spiders are immune.
  webR: 17, webSlow: 0.5, webSlowMax: 0.35, /* speed multipliers: 0.5 = 50% slow on layer 1, 0.35 = 65% slow at max layers */ webDashSlow: 0.8, webDashSlowMax: 0.7, maxWebs: 120, webStuck: 1.0, webStuckSlow: 0.15, webPlayerMax: 1.0, webImmune: 0.6,
  // Stacking: a Spider laying a web within webStackR of an existing web adds a LAYER (strength, cap webMaxStr). Each pass by the player or a bug
  // (leaving / webPlayerMax s standing / bug freed) removes ONE layer; the web only tears at 0. Bugs stay stuck webStuckPerLayer longer per extra layer.
  webStackR: 11, webMaxStr: 4, webStuckPerLayer: 0.3,
  // Score (provisional): time*10 + lured kills*50 + webs broken by you*5 + webs broken by bugs*2 + pulses*100
  score: { time: 10, lure: 50, webPlayer: 5, webBug: 2, pulse: 100 },
  stingerLife: 2.6,
  fightDmg: { sting: 1, charge: 2, lunge: 2 },        // friendly-fire damage to other bugs
};

const TYPES = {
  roach:  { name: 'Roach',  color: '#ff5a3c', r: 9,  hp: 1, mass: 1.0,  desc: 'HUNTER: always chases you. Lure it into other bugs!' },
  wasp:   { name: 'Wasp',   color: '#ffd23c', r: 8,  hp: 5, mass: 0.9,  desc: 'SHOOTER: keeps away, fires stinger bursts (they hit bugs too)' },
  spider: { name: 'Spider', color: '#b36bff', r: 11, hp: 7, mass: 0.8,  desc: 'WEAVER: slow; webs slow you & bugs; re-laid webs stack (x4)' },
  beetle: { name: 'Beetle', color: '#4fd36a', r: 14, hp: 4, mass: 0.6,  desc: 'CHARGER: telegraphs, then rams in a line through anything' },
  moth:   { name: 'Moth',   color: '#5ee6ff', r: 7,  hp: 1, mass: 1.25, desc: 'ALLY: touch to recruit; it shields YOU (absorbs one hit on you)' },
};

// ---------- helpers ----------
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const hyp = Math.hypot;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function angLerp(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
let nextId = 1;

let best = 0;
try { best = parseFloat(localStorage.getItem('vacuum_best')) || 0; } catch (e) {}
function saveBest(v) { try { localStorage.setItem('vacuum_best', String(v)); } catch (e) {} }
// best SCORE is stored separately from best TIME; every run is also kept as a record (last 25 runs)
let bestScore = 0;
try { bestScore = parseFloat(localStorage.getItem('vacuum_best_score')) || 0; } catch (e) {}
function saveRun(rec) {
  try { localStorage.setItem('vacuum_best_score', String(bestScore)); } catch (e) {}
  try { let runs = []; try { runs = JSON.parse(localStorage.getItem('vacuum_runs') || '[]') || []; } catch (e) {} runs.push(rec); if (runs.length > 25) runs = runs.slice(-25); localStorage.setItem('vacuum_runs', JSON.stringify(runs)); } catch (e) {}
}

// ---------- audio (tiny synth, optional) ----------
let actx = null;
function beep(f, d = 0.1, type = 'square', vol = 0.04) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

// iOS only lets audio start from a user gesture: create/resume the context on touch, play a silent buffer once.
let audioUnlocked = false;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (!audioUnlocked) { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); audioUnlocked = true; }
  } catch (e) {}
}

// ---------- view / touch state ----------
// World coordinates stay 900x700 (arena centre CX,CY). The canvas fills the screen and the VIEW (logical rect VX0,VY0,VW,VH)
// is chosen so the whole arena (diameter ~660) is always visible, in portrait and landscape, at any devicePixelRatio.
let dpr = 1, viewScale = 1, cssW = 900, cssH = 700, VX0 = 0, VY0 = 0, VW = 900, VH = 700;
let safe = { t: 0, r: 0, b: 0, l: 0 };                // safe-area insets in CSS px (iPhone notch / home bar)
let touchMode = false;                                // true once a touch is seen (or on coarse-pointer devices)
const touch = { ax: 0, ay: 0, joy: null, joyOn: false, dashId: null, dashHeld: false, dashBuf: 0, pauseId: null };
const JOY_R = 58, DASH_R = 46;
try { touchMode = !!((window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (navigator.maxTouchPoints > 0 && /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent)) || ('ontouchstart' in window && !window.matchMedia('(pointer: fine)').matches)); } catch (e) {}
function layoutTouch() { // button positions in CSS px
  return {
    dash: { x: cssW - safe.r - 74, y: cssH - safe.b - 88 },
    pause: { x: cssW - safe.r - 34, y: safe.t + 70, r: 22 },
    hint: { x: safe.l + 96, y: cssH - safe.b - 104 },
  };
}
function resizeView() {
  if (typeof canvas.getBoundingClientRect !== 'function') return;
  const rect = canvas.getBoundingClientRect();
  cssW = Math.max(1, rect.width); cssH = Math.max(1, rect.height);
  dpr = Math.min(3, window.devicePixelRatio || 1);
  const bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  // the arena needs a 700x700 logical square (R=310 + rim + margin); fit that, extend the other axis
  viewScale = Math.min(cssW, cssH) / 700;
  VW = cssW / viewScale; VH = cssH / viewScale;
  VX0 = CX - VW / 2;
  // portrait: arena sits in the upper-middle so HUD fits above and thumbs have room below
  const above = VH > 700 ? clamp(VH * 0.44, 350, VH - 350) : VH / 2;
  VY0 = CY - above;
  try { const el = document.getElementById('safe'); if (el) { const cs = getComputedStyle(el); safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 }; } } catch (e) {}
}

// ---------- state ----------
let G;
const keys = {};
let bgDust = [];
for (let i = 0; i < 120; i++) { const a = rnd(TAU), r = Math.sqrt(Math.random()) * R; bgDust.push([CX + Math.cos(a) * r, CY + Math.sin(a) * r, rnd(0.6, 2)]); }

function newGame(phase) {
  G = {
    phase: phase || 'ready', // ready | play | dead
    t: 0, pulseN: 0, nextPulseAt: T.firstPulse, trickleT: 12, debrisT: 8,
    pulseT: -1, pulseDur: 0, warned: false, spawnPlan: [],
    filterR: T.coreR(0),
    player: { x: CX, y: CY + 230, vx: 0, vy: 0, r: T.playerR, dashT: 0, dashCd: 0, dx: 0, dy: -1, ifr: 0, trail: [] },
    bugs: [], clumps: [], parts: [], texts: [], streaks: [], webs: [], rings: [], stingers: [], tally: {},
    lureKills: 0, sucked: 0, bugsKilled: 0, websPlayer: 0, websBugs: 0, score: 0, newBestScore: false, shake: 0, cause: '', newBest: false, deathT: 0, lastBeep: -1,
  };
  for (let i = 0; i < 40; i++) G.streaks.push({ a: rnd(TAU), r: rnd(R), l: rnd(10, 30) });
  // opening population
  const p = G.player;
  const place = (type, rmin, rmax) => {
    for (let k = 0; k < 40; k++) {
      const a = rnd(TAU), r = rnd(rmin, rmax), x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r;
      if (hyp(x - p.x, y - p.y) > 200) { const b = makeBug(type, x, y); b.spawn = 1.6; G.bugs.push(b); return; }
    }
  };
  place('roach', 150, 260);
  for (let i = 0; i < 2; i++) { place('wasp', 100, 250); place('spider', 100, 250); place('moth', 150, 250); } place('beetle', 100, 220);
  for (let i = 0; i < 7; i++) addClump(rnd(TAU), rnd(70, 240));
  return G;
}

function makeBug(type, x, y) {
  const d = TYPES[type];
  const ty = G.tally[type] || (G.tally[type] = { n: 0, fight: 0, sucked: 0, shield: 0, by: {} }); ty.n++;
  return { id: nextId++, type, x, y, vx: 0, vy: 0, ang: rnd(TAU), r: d.r, hp: d.hp, spawn: 0.9, stun: 0, iCd: 0, flash: 0,
    bonded: false, state: 'idle', st: 0, cd: type === 'wasp' ? rnd(2.5, 4) : rnd(0.5, 2), wt: 0, wa: rnd(TAU), dx: 0, dy: 0, lastHitBy: null,
    protect: T.protect, aggro: false, webT: 0, stuck: 0, webImm: 0, caught: null };
}
function addClump(a, r) {
  const rad = rnd(13, 22);
  G.clumps.push({ x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, r: rad, seed: rnd(100), spawn: 0.6 });
}

// ---------- fx ----------
function burst(x, y, color, n, spd, life = 0.6) {
  for (let i = 0; i < n; i++) { const a = rnd(TAU), s = rnd(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size: rnd(1.5, 3.5) }); }
}
function floatText(x, y, txt, color) { G.texts.push({ x, y, txt, color, life: 1.1 }); }

// ---------- pulse logic ----------
function pullEnv() {
  if (G.pulseT < 0) return 0;
  return Math.min(sstep(G.pulseT / 0.5), sstep((G.pulseDur - G.pulseT) / 0.6));
}
function zoneR() { return G.filterR + T.zoneBase + T.zoneSwell * pullEnv(); }
// pull toward the filter: strength = base px/s * pulse envelope * mass; `near` adds up to +50% close to the core (player only)
function pullVec(x, y, base, near) {
  const env = pullEnv(); if (env <= 0) return [0, 0];
  const dx = CX - x, dy = CY - y, d = hyp(dx, dy) || 1;
  const s = base * env * (near ? 1 + Math.max(0, (150 - d) / 150) * 0.5 : 1);
  return [dx / d * s, dy / d * s];
}
// non-Roach bugs steer away from the danger zone (added on top of AI velocity, so Roach AI stays exactly as before)
function avoidVec(b) {
  if (b.type === 'roach') return [0, 0];
  const dx = b.x - CX, dy = b.y - CY, d = hyp(dx, dy) || 1, edge = zoneR() + 30, core = G.filterR + b.r;
  if (d >= edge) return [0, 0];
  const k = clamp((edge - d) / (edge - core), 0, 1) * T.bugAvoid;
  return [dx / d * k, dy / d * k];
}

function pickType(mothCount) {
  const w = { roach: 1.2, wasp: 1.2, spider: 1.2, beetle: 1, moth: mothCount < 2 ? 0.7 : 0 };
  let sum = 0; for (const k in w) sum += w[k];
  let r = rnd(sum), type = 'roach';
  for (const k in w) { r -= w[k]; if (r <= 0) { type = k; break; } }
  return type;
}
function spawnBug(type, x, y) {
  const b = makeBug(type, x, y); G.bugs.push(b); return b;
}
// continuous trickle (scales with elapsed time): single bugs / small groups drop in at the rim, plus debris clumps
function rimSpot() {
  const p = G.player;
  for (let k = 0; k < 30; k++) {
    const a = rnd(TAU), x = CX + Math.cos(a) * (R - 26), y = CY + Math.sin(a) * (R - 26);
    if (hyp(x - p.x, y - p.y) > 150) return [x, y];
  }
  return null;
}
function trickleSpawn(dt) {
  if (G.pulseT >= 0 || G.nextPulseAt - G.t < T.warn + 0.5) return; // not during suction or the telegraph window
  G.trickleT -= dt;
  if (G.trickleT <= 0) {
    G.trickleT = T.trickle(G.t) * rnd(0.8, 1.2);
    if (G.bugs.length < T.maxBugs) {
      const sp = rimSpot();
      if (sp) {
        const type = pickType(G.bugs.filter(b => b.type === 'moth').length);
        spawnBug(type, sp[0], sp[1]);
      }
    }
  }
  G.debrisT -= dt;
  if (G.debrisT <= 0) {
    G.debrisT = T.debrisTrickle(G.t) * rnd(0.8, 1.2);
    if (G.clumps.length < T.maxClumps) {
      const p = G.player;
      for (let k = 0; k < 30; k++) {
        const a = rnd(TAU), r = rnd(G.filterR + T.zoneBase + T.zoneSwell + 50, R - 30), x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r;
        if (hyp(x - p.x, y - p.y) > 70) { addClump(a, r); break; }
      }
    }
  }
}

function planSpawns() {
  const n = G.pulseN + 1; // upcoming pulse number
  let budget = Math.min(18, 6 + n * 2); // big waves: pulses are rare events
  const plan = [], p = G.player;
  const mothCount = G.bugs.filter(b => b.type === 'moth').length;
  const room = T.maxBugs - G.bugs.length;
  const spot = () => {
    for (let k = 0; k < 30; k++) { const a = rnd(TAU), x = CX + Math.cos(a) * (R - 26), y = CY + Math.sin(a) * (R - 26);
      if (hyp(x - p.x, y - p.y) > 150) return [x, y]; }
    const a = rnd(TAU); return [CX + Math.cos(a) * (R - 26), CY + Math.sin(a) * (R - 26)];
  };
  while (budget > 0 && plan.length < room) {
    const type = pickType(mothCount + plan.filter(q => q.type === 'moth').length);
    const [x, y] = spot(); plan.push({ type, x, y }); budget--;
  }
  const nc = Math.min(5, 3 + (n % 2)) - (G.clumps.length + 4 > T.maxClumps ? 2 : 0);
  for (let i = 0; i < Math.max(0, nc); i++) { const [x, y] = spot(); plan.push({ type: 'clump', x, y }); }
  G.spawnPlan = plan;
}

function startPulse() {
  G.pulseN++; G.pulseT = 0; G.pulseDur = T.pullDur(G.pulseN); G.warned = false;
  G.nextPulseAt = G.t + T.interval(G.pulseN); G.trickleT = Math.max(G.trickleT, 2.5);
  for (const s of G.spawnPlan) {
    if (s.type === 'clump') { if (G.clumps.length >= T.maxClumps) continue; const c = { x: s.x, y: s.y, r: rnd(13, 22), seed: rnd(100), spawn: 0.6 }; G.clumps.push(c); }
    else spawnBug(s.type, s.x, s.y);
  }
  G.spawnPlan = [];
  G.shake = 8; beep(80, 0.5, 'sawtooth', 0.08);
}

// ---------- bug AI ----------
function nearest(b, pred, maxD) {
  let best = null, bd = maxD;
  for (const o of G.bugs) { if (o === b || o.spawn > 0 || !pred(o)) continue; const d = hyp(o.x - b.x, o.y - b.y); if (d < bd) { bd = d; best = o; } }
  return best;
}
function wander(b, dt, speed) {
  b.wt -= dt;
  const dc = hyp(b.x - CX, b.y - CY);
  if (b.wt <= 0) { b.wa = rnd(TAU); b.wt = rnd(1, 2.5); }
  if (dc > R - 45) b.wa = Math.atan2(CY - b.y, CX - b.x);
  return [Math.cos(b.wa) * speed, Math.sin(b.wa) * speed];
}
function isLethal(b) {
  if (b.spawn > 0) return false;
  return b.type === 'roach' || (b.type === 'spider' && b.state === 'lunge') || (b.type === 'beetle' && b.state === 'charge');
}

function updateBug(b, dt) {
  const p = G.player;
  if (b.spawn > 0) { b.spawn -= dt; return; }
  b.iCd -= dt; b.flash -= dt; b.cd -= dt;
  let dvx = 0, dvy = 0, accel = 8;
  const dp = hyp(p.x - b.x, p.y - b.y);
  const aggroCheck = (rin, rout) => { if (!b.aggro && dp < rin) b.aggro = true; else if (b.aggro && dp > rout) b.aggro = false; return b.aggro; };
  const toward = (tx, ty, s) => { const d = hyp(tx - b.x, ty - b.y) || 1; return [(tx - b.x) / d * s, (ty - b.y) / d * s]; };

  if (b.stun > 0) { b.stun -= dt; accel = 14; }
  else switch (b.type) {
    case 'roach': {
      const s = Math.min(135, 92 + 2.5 * (G.pulseN + G.t / 15));
      const wob = Math.sin(G.t * 3 + b.id) * 0.25, a = Math.atan2(p.y - b.y, p.x - b.x) + wob;
      dvx = Math.cos(a) * s; dvy = Math.sin(a) * s; break;
    }
    case 'wasp': {
      const ag = aggroCheck(T.wasp.aggro, T.wasp.leash), W = T.wasp, nx = (p.x - b.x) / (dp || 1), ny = (p.y - b.y) / (dp || 1);
      if (b.state === 'windup') { // telegraph: aim tracks the player, then locks for the last 0.2s
        b.st -= dt; accel = 10; dvx = -nx * 20; dvy = -ny * 20;
        if (b.st > 0.2) { b.dx = nx; b.dy = ny; }
        if (b.st <= 0) { fireStingers(b); b.state = 'move'; b.cd = Math.max(1.7, 3.1 - G.t / 110) * rnd(0.85, 1.15); }
        break;
      }
      if (!ag) { [dvx, dvy] = wander(b, dt, 38); b.state = 'idle'; break; }
      b.state = 'move';
      const sd = Math.floor(G.t / 2.5 + b.id) % 2 ? 1 : -1, rad = dp < W.keepMin ? -1 : dp > W.keepMax ? 1 : 0;
      dvx = nx * rad * 85 - ny * sd * 62; dvy = ny * rad * 85 + nx * sd * 62; accel = 5;
      const dcw = hyp(b.x - CX, b.y - CY); if (dcw > R - 70) { dvx += (CX - b.x) / dcw * 70; dvy += (CY - b.y) / dcw * 70; }
      if (b.cd <= 0 && dp < W.aggro + 20) { b.state = 'windup'; b.st = W.windup; b.dx = nx; b.dy = ny; }
      break;
    }
    case 'spider': {
      if (b.state === 'windup') { b.st -= dt; accel = 12; if (b.st <= 0) { b.state = 'lunge'; b.st = 0.28; } break; }
      if (b.state === 'lunge') { b.st -= dt; dvx = b.dx * 220; dvy = b.dy * 220; accel = 16; if (b.st <= 0) { b.state = 'idle'; b.cd = 2.6; } break; }

      { t: 'PROJECT VACUUM', f: 'bold 56px system-ui,sans-serif', h: 46, c: '#ff6a50' },

      { t: 'Bugs and dust keep dropping in. Every so often a VACUUM PULSE swells the filter danger zone and drags you in.', f: '15px system-ui,sans-serif', h: 22, c: '#9fb0d8' },
      { t: 'Lure bugs into each other: stingers and Beetle charges hit whatever is in the way.', f: '15px system-ui,sans-serif', h: 22, c: '#9fb0d8' },
    ] });

    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5); ctx.fillText(touchMode ? 'TAP to start' : 'Press SPACE or a move key to start', CX, 560); ctx.globalAlpha = 1;

function drawTouchUI(t) {

      ctx.fillStyle = 'rgba(255,244,214,0.55)'; ctx.beginPath(); ctx.arc(j.ox + kx * kk, j.oy + ky * kk, 26, 0, TAU); ctx.fill();

}

// ---------- touch input (pointer events, multi-touch) ----------

  document.addEventListener('visibilitychange', () => { if (document.hidden && G.phase === 'play') { paused = true; touchReset(); } });
}

// ---------- input & loop ----------
let paused = false;
function startRun() { newGame('play'); }
// Keyboard: robust against focus problems. Keys are read by e.code with an e.key fallback (case-insensitive), listeners are

newGame('ready');
setupTouch();
resizeView();
let last = performance.now(), clock = 0;
function frame(now) {
  if (typeof canvas.getBoundingClientRect === 'function') { const r = canvas.getBoundingClientRect(); if (Math.abs(r.width - cssW) > 0.5 || Math.abs(r.height - cssH) > 0.5 || dpr !== Math.min(3, window.devicePixelRatio || 1)) resizeView(); }

requestAnimationFrame(frame);

})();
